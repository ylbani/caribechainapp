<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaribeChain Desktop Miner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.3);
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 242, 254, 0.4);
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.15) 0%, transparent 65%),
                radial-gradient(circle at 10% 80%, rgba(121, 40, 202, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .miner-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            width: 100%;
            max-width: 580px;
            padding: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-tag {
            background: var(--accent-gradient);
            color: #040914;
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .net-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 14px;
            border-radius: 100px;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: rgba(8, 12, 20, 0.8);
            border: 1px solid var(--border);
            color: #fff;
            padding: 14px 16px;
            border-radius: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .btn-gen {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: #fff;
            padding: 0 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-gen:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(8, 12, 20, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
        }

        .stat-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.3s ease;
        }

        .btn-mine {
            width: 100%;
            background: var(--accent-gradient);
            color: #040914;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-mine:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .btn-mine.active {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.35);
        }

        .balance-strip {
            margin-top: 20px;
            background: rgba(0, 242, 254, 0.06);
            border: 1px solid var(--border-hover);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .console-box {
            margin-top: 20px;
            background: #04060a;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-dim);
            height: 110px;
            overflow-y: auto;
        }

        .console-entry {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="miner-card">
        
        <div class="header">
            <div class="logo">
                CARIBECHAIN <span class="logo-tag">MINER</span>
            </div>
            <div class="net-status" id="status-badge">
                <div class="pulse-dot"></div>
                <span id="status-text">DIGITALOCEAN ONLINE</span>
            </div>
        </div>

        <div class="section-title">Tu Dirección de Billetera (Recompensas $CAR)</div>
        <div class="input-box">
            <input type="text" id="wallet-input" placeholder="CAR0000000000000000000000000000000000000000" />
            <button class="btn-gen" onclick="autoGenerateWallet()">✨ Crear Wallet</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="section-title" style="margin-bottom: 0;">Hashrate</div>
                <div class="stat-val" id="val-hashrate" style="color: var(--accent);">0.0 H/s</div>
            </div>
            <div class="stat-box">
                <div class="section-title" style="margin-bottom: 0;">Bloques Ganados</div>
                <div class="stat-val" id="val-blocks" style="color: var(--success);">0</div>
            </div>
            <div class="stat-box">
                <div class="section-title" style="margin-bottom: 0;">Dificultad</div>
                <div class="stat-val" id="val-diff" style="color: #f59e0b;">4</div>
            </div>
        </div>

        <div class="progress-bar-bg">
            <div id="miner-bar" class="progress-bar-fill"></div>
        </div>

        <button id="btn-start" class="btn-mine" onclick="toggleMining()">
            <span id="btn-icon">▶</span> <span id="btn-text">INICIAR MINERÍA</span>
        </button>

        <div class="balance-strip">
            <span style="color: var(--text-dim);">Saldo Acumulado:</span>
            <strong id="val-balance" style="color: var(--accent); font-family: 'JetBrains Mono', monospace;">0.00000000 CAR</strong>
        </div>

        <div class="console-box" id="console-logs">
            <div class="console-entry">🚀 CaribeChain Miner listo. Haz clic en 'INICIAR MINERÍA' para comenzar.</div>
        </div>

    </div>

    <script>
        const NODE_URL = "https://caibechaiapi.autodilerpro.com";
        let isMining = false;
        let miningInterval = null;
        let blocksWon = 0;
        let totalHashes = 0;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const box = document.getElementById('console-logs');
            box.innerHTML += `<div class="console-entry">[${time}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function autoGenerateWallet() {
            const array = new Uint8Array(20);
            crypto.getRandomValues(array);
            const hex = Array.from(array).map(b => b.toString(16).padStart(2, '0')).join('');
            const address = "CAR" + hex;
            document.getElementById('wallet-input').value = address;
            localStorage.setItem("caribe_miner_address", address);
            log(`✨ Nueva wallet generada: ${address}`);
            updateBalance();
        }

        async function updateBalance() {
            const addr = document.getElementById('wallet-input').value.trim();
            if (!addr || !addr.startsWith("CAR")) return;
            try {
                const res = await fetch(`${NODE_URL}/balance/${addr}`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('val-balance').innerText = `${data.balance.toFixed(8)} CAR`;
                }
            } catch (e) {}
        }

        async function updateNetworkStatus() {
            try {
                const res = await fetch(`${NODE_URL}/status`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('val-diff').innerText = data.difficulty || 4;
                    document.getElementById('status-text').innerText = "DIGITALOCEAN ONLINE";
                    document.getElementById('status-badge').style.color = "var(--success)";
                }
            } catch (e) {
                document.getElementById('status-text').innerText = "OFFLINE";
                document.getElementById('status-badge').style.color = "var(--error)";
            }
        }

        async function toggleMining() {
            const addr = document.getElementById('wallet-input').value.trim();
            if (!addr || !addr.startsWith("CAR")) {
                alert("Por favor ingresa o genera una dirección CAR válida.");
                return;
            }

            const btn = document.getElementById('btn-start');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const hashrateEl = document.getElementById('val-hashrate');
            const bar = document.getElementById('miner-bar');

            if (isMining) {
                isMining = false;
                clearInterval(miningInterval);
                btn.classList.remove('active');
                btnText.innerText = "INICIAR MINERÍA";
                btnIcon.innerText = "▶";
                hashrateEl.innerText = "0.0 H/s";
                bar.style.width = "0%";
                log("🛑 Minería detenida.");
            } else {
                isMining = true;
                btn.classList.add('active');
                btnText.innerText = "DETENER MINERÍA";
                btnIcon.innerText = "⏹";
                log(`⛏️ Minería iniciada con la wallet: ${addr}`);

                let p = 0;
                miningInterval = setInterval(async () => {
                    const hr = Math.floor(Math.random() * 450) + 120;
                    hashrateEl.innerText = `${hr} H/s`;
                    p += Math.random() * 5;

                    if (p >= 100) {
                        p = 0;
                        try {
                            const res = await fetch(`${NODE_URL}/mining/submit`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ miner_address: addr })
                            });

                            if (res.ok) {
                                blocksWon++;
                                document.getElementById('val-blocks').innerText = blocksWon;
                                log(`🎉 ¡BLOQUE ENCONTRADO! +50 $CAR ganados y acreditados a tu wallet.`);
                                updateBalance();
                            }
                        } catch (e) {
                            log(`Error enviando bloque al nodo: ${e.message}`);
                        }
                    }
                    bar.style.width = `${p}%`;
                }, 800);
            }
        }

        window.onload = () => {
            const saved = localStorage.getItem("caribe_miner_address");
            if (saved) {
                document.getElementById('wallet-input').value = saved;
                updateBalance();
            }
            updateNetworkStatus();
            setInterval(updateNetworkStatus, 15000);
        };
    </script>
</body>
</html>
